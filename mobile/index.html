    /* Professional blue business theme */
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f8ff;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #bfdbfe; border-radius: 8px; }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(0, 40, 100, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      border: 1px solid #e6edf8;
      transition: all 0.15s ease;
    }
    .card:hover { box-shadow: 0 8px 22px rgba(0, 80, 200, 0.08); }

    .table-row-hover:hover { background-color: #f0f6ff; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-warning { background: #fef3c7; color: #b45309; }
    .badge-danger { background: #fee2e2; color: #b91c1c; }
    .badge-info { background: #dbeafe; color: #1e40af; }
    .badge-purple { background: #f3e8ff; color: #6b21a8; }
    .badge-teal { background: #ccfbf1; color: #115e59; }

    /* smooth transitions */
    .nav-item {
      transition: all 0.12s ease;
      border-radius: 10px;
      cursor: pointer;
    }
    .nav-item:hover { background-color: #eff6ff; }
    .nav-item.active {
      background-color: #dbeafe;
      color: #1e3a8a;
      font-weight: 600;
      box-shadow: inset 4px 0 0 #2563eb;
    }

    /* POS product cards */
    .product-card {
      transition: transform 0.1s, border 0.1s, background 0.1s;
      cursor: pointer;
      border: 1px solid #e6edf8;
    }
    .product-card:hover {
      background: #f0f7ff;
      border-color: #93c5fd;
      transform: translateY(-1px);
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e3a8a;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 12px 30px rgba(30, 58, 138, 0.25);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.3s;
    }

    /* buttons custom */
    .btn-primary {
      background-color: #2563eb;
      transition: background-color 0.15s;
    }
    .btn-primary:hover { background-color: #1d4ed8; }

    /* header blue tint */
    .header-blue { background: #ffffff; border-bottom: 1px solid #dbeafe; }

    /* modal polish */
    .modal-overlay {
      backdrop-filter: blur(3px);
      background: rgba(15, 23, 42, 0.45);
    }

    /* sidebar mobile */
    #sidebar {
      transition: transform 0.2s ease;
    }
    #sidebar.open {
      transform: translateX(0) !important;
    }

    /* stat card mini charts */
    .mini-chart { height: 40px; width: 100%; }

    /* pulse for notification */
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pulse-dot { animation: pulse-dot 1.5s infinite; }

    /* Print-friendly invoice */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
    }

  // ---------- INVENTORY ----------
  function renderInventory() {
    const totalStock = products.reduce((a,b) => a + b.stock, 0);

    const retailValue = products.reduce((a,b) => a + (b.selling * b.stock), 0);
    const lowStock = products.filter(p => p.stock <= p.minStock && p.stock > 0);

    pageContent.innerHTML = `
      <div class="space-y-6">

          <div class="card p-5"><p class="text-xs text-blue-500 font-medium">Low Stock</p><p class="text-2xl font-semibold text-amber-600">${lowStock.length}</p></div>
          <div class="card p-5"><p class="text-xs text-blue-500 font-medium">Out of Stock</p><p class="text-2xl font-semibold text-rose-600">${outOfStock.length}</p></div>

          <button class="stock-tab text-sm bg-white border border-blue-100 px-4 py-1.5 rounded-lg" data-filter="low">Low Stock</button>
          <button class="stock-tab text-sm bg-white border border-blue-100 px-4 py-1.5 rounded-lg" data-filter="out">Out of Stock</button>
        </div>

        <div class="card p-0 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-blue-50/70 text-blue-800 text-xs uppercase tracking-wider">
                <tr>
                  <th class="px-5 py-3 text-left">Product</th>
                  <th class="px-5 py-3 text-left">Category</th>
                  <th class="px-5 py-3 text-left">IMEI</th>
                  <th class="px-5 py-3 text-right">Stock</th>
                  <th class="px-5 py-3 text-right">Min Stock</th>
                  <th class="px-5 py-3 text-right">Cost</th>
                  <th class="px-5 py-3 text-right">Value</th>
                  <th class="px-5 py-3 text-left">Status</th>
                </tr>
              </thead>
              <tbody id="inventoryTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    function renderInventoryRows(filter = 'all') {
      const tbody = document.getElementById('inventoryTableBody');
      if (!tbody) return;
      let filtered = products;
      if (filter === 'low') filtered = products.filter(p => p.stock <= p.minStock && p.stock > 0);
      else if (filter === 'out') filtered = products.filter(p => p.stock === 0);
      tbody.innerHTML = filtered.map(p => {
        const status = p.stock <= 0 ? 'Out of Stock' : (p.stock <= p.minStock ? 'Low Stock' : 'In Stock');
        const badge = p.stock <= 0 ? 'badge-danger' : (p.stock <= p.minStock ? 'badge-warning' : 'badge-success');
        return `<tr class="border-b border-blue-50 table-row-hover">
          <td class="px-5 py-3 font-medium">${p.name}</td>
          <td class="px-5 py-3 text-slate-500">${p.category}</td>

        </tr>`;

    renderInventoryRows();

      tab.addEventListener('click', () => {
        document.querySelectorAll('.stock-tab').forEach(t => { t.classList.remove('btn-primary', 'text-white'); t.classList.add('bg-white', 'border', 'border-blue-100'); });
        tab.classList.add('btn-primary', 'text-white');
        tab.classList.remove('bg-white', 'border', 'border-blue-100');
        renderInventoryRows(tab.dataset.filter);
      });
    });

            </div>

          </div>
          <div class="p-3 border-b border-blue-50">
            <label class="text-xs text-blue-500 font-medium">Customer</label>
            <select id="customerSelect" class="w-full border border-blue-100 rounded-lg px-2 py-1.5 text-sm mt-1 focus:ring-2 focus:ring-blue-200 outline-none">
              <option>Walk-in Customer</option>
              ${customers.map(c => `<option>${c.name} (${c.phone})</option>`).join('')}
              <option>+ Add New Customer</option>
            </select>
          </div>
          <div id="cartItems" class="p-3 space-y-2 overflow-y-auto flex-1 max-h-64"></div>
          <div class="border-t border-blue-100 p-4 space-y-2 bg-blue-50/40">
            <div class="flex justify-between text-sm"><span>Subtotal</span><span id="cartSubtotal">Rs 0</span></div>
            <div class="flex justify-between items-center text-sm"><span>Discount</span><div class="flex items-center gap-2"><input id="discountInput" type="number" value="0" min="0" max="100" class="w-16 border border-blue-200 rounded-lg px-2 py-1 text-sm text-right focus:ring-2 focus:ring-blue-200 outline-none">%</div></div>
            <div class="flex justify-between text-sm"><span>Tax (13%)</span><span id="cartTax">Rs 0</span></div>
            <div class="flex justify-between font-semibold text-lg border-t border-blue-100 pt-2"><span>Total</span><span id="cartTotal" class="text-blue-700">Rs 0</span></div>
            <div class="grid grid-cols-2 gap-2">
              <div><label class="text-xs text-blue-500">Paid</label><input id="paidInput" type="number" value="0" class="w-full border border-blue-200 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-blue-200 outline-none"></div>
              <div><label class="text-xs text-blue-500">Change</label><p id="changeDisplay" class="text-sm font-medium pt-1.5 text-emerald-600">Rs 0</p></div>
            </div>
            <div class="flex justify-between items-center"><span class="text-sm">Payment</span><select id="paymentMethod" class="border border-blue-200 rounded-lg px-2 py-1 text-sm focus:ring-2 focus:ring-blue-200 outline-none"><option>Cash</option><option>Card</option><option>eSewa</option><option>Khalti</option><option>Bank</option><option>Credit</option></select></div>
            <button id="completeSaleBtn" class="w-full btn-primary text-white py-3 rounded-xl font-medium transition flex items-center justify-center gap-2 shadow-sm shadow-blue-200"><i class="fas fa-check-circle"></i> Complete Sale</button>
          </div>
        </div>
      </div>
    `;

    let currentSearch = '';
    let currentCategory = 'All';

    function renderPosProducts() {
      const grid = document.getElementById('posProductGrid');
      if (!grid) return;
      const filtered = posProducts.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(currentSearch.toLowerCase()) || p.imei.includes(currentSearch) || p.sku.toLowerCase().includes(currentSearch.toLowerCase());
        const matchCat = currentCategory === 'All' || p.category === currentCategory;
        return matchSearch && matchCat;
      });
      grid.innerHTML = filtered.map(p => `
        <div class="product-card bg-white p-4 rounded-xl flex flex-col" data-id="${p.id}">
          <div class="flex justify-between items-start"><p class="font-medium">${p.name}</p><span class="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full">${p.stock} left</span></div>

          <p class="text-xs text-slate-500">${p.brand} · ${p.storage}</p>
          <p class="text-lg font-semibold mt-2 text-blue-700">Rs ${p.selling.toLocaleString()}</p>
          <button class="add-to-cart mt-2 text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 py-1.5 rounded-lg transition" data-id="${p.id}">+ Add to cart</button>
        </div>
      `).join('');
      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          const prod = products.find(p => p.id === id);
          if (prod && prod.stock > 0) {
            const existing = cart.find(c => c.id === id);
            if (existing) { if (existing.qty < prod.stock) existing.qty += 1; else { showToast('Stock limit reached', 'warning'); return; } }
            else cart.push({ ...prod, qty: 1 });
            updateCartUI();
            showToast(`${prod.name} added to cart`, 'success');
          }
        });
      });
    }

    renderPosProducts();
    document.getElementById('posSearch')?.addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderPosProducts();
    });

    document.querySelectorAll('.cat-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.cat-pill').forEach(p => { p.classList.remove('active'); p.classList.add('bg-white', 'text-slate-600'); });
        pill.classList.add('active');
        pill.classList.remove('bg-white', 'text-slate-600');
        currentCategory = pill.dataset.cat;
        renderPosProducts();
      });
    });

    // customer select handling
    document.getElementById('customerSelect')?.addEventListener('change', (e) => {
      if (e.target.value === '+ Add New Customer') {
        showModal('Add New Customer', `
          <div class="space-y-3 text-sm">
            <input id="posNewCustName" placeholder="Customer Name" class="w-full border border-blue-100 rounded-lg p-2 focus:ring-2 focus:ring-blue-200 outline-none">
            <input id="posNewCustPhone" placeholder="Phone Number" class="w-full border border-blue-100 rounded-lg p-2 focus:ring-2 focus:ring-blue-200 outline-none">
            <input id="posNewCustAddress" placeholder="Address (optional)" class="w-full border border-blue-100 rounded-lg p-2 focus:ring-2 focus:ring-blue-200 outline-none">
          </div>
        `, () => {
          const name = document.getElementById('posNewCustName')?.value || 'New Customer';
          const phone = document.getElementById('posNewCustPhone')?.value || '9800000000';
          const address = document.getElementById('posNewCustAddress')?.value || 'Kathmandu';
          customers.push({ id: customers.length + 1, name, phone, email: '', address, totalPurchase: 0, paid: 0, due: 0, lastPurchase: '-', status: 'Active' });
          renderPOS();
          showToast(`Customer ${name} added (demo)`);
        });
        e.target.value = 'Walk-in Customer';
      }
    });

    // cart UI
    window.updateCartUI = function() {
      const cartContainer = document.getElementById('cartItems');
      if (!cartContainer) return;
      document.getElementById('cartItemCount').innerText = `${cart.reduce((a,b) => a + b.qty, 0)} items`;
      if (cart.length === 0) {
        cartContainer.innerHTML = `<div class="text-center text-blue-300 text-sm py-8"><i class="fas fa-shopping-bag text-2xl mb-2 opacity-40"></i><p>Cart is empty</p></div>`;
      } else {
        cartContainer.innerHTML = cart.map((item, idx) => `
          <div class="flex items-center justify-between gap-2 bg-white p-2 rounded-lg border border-blue-100">
            <div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">${item.name}</p><p class="text-xs text-blue-400">Rs ${item.selling.toLocaleString()}</p></div>
            <div class="flex items-center gap-1"><button class="qty-minus w-6 h-6 rounded-md bg-blue-50 text-sm hover:bg-blue-100" data-idx="${idx}">-</button><span class="w-6 text-center text-sm">${item.qty}</span><button class="qty-plus w-6 h-6 rounded-md bg-blue-50 text-sm hover:bg-blue-100" data-idx="${idx}">+</button></div>
            <div class="text-sm font-medium w-20 text-right">Rs ${(item.selling * item.qty).toLocaleString()}</div>
            <i class="fas fa-times text-blue-200 hover:text-rose-500 cursor-pointer remove-item" data-idx="${idx}"></i>
          </div>
        `).join('');
        document.querySelectorAll('.qty-minus').forEach(btn => btn.addEventListener('click', (e) => { const idx = e.target.dataset.idx; if (cart[idx].qty > 1) cart[idx].qty -= 1; else cart.splice(idx,1); updateCartUI(); }));
        document.querySelectorAll('.qty-plus').forEach(btn => btn.addEventListener('click', (e) => { const idx = e.target.dataset.idx; const product = products.find(p => p.id === cart[idx].id); if (cart[idx].qty < product.stock) cart[idx].qty += 1; else showToast('Stock limit', 'warning'); updateCartUI(); }));
        document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', (e) => { const idx = e.target.dataset.idx; cart.splice(idx,1); updateCartUI(); }));
      }
      const subtotal = cart.reduce((a,b) => a + (b.selling * b.qty), 0);
      const discountVal = parseFloat(document.getElementById('discountInput')?.value) || 0;
      const discountAmt = subtotal * (discountVal / 100);
      const taxable = subtotal - discountAmt;
      const tax = taxable * 0.13;
      const total = taxable + tax;
      const paid = parseFloat(document.getElementById('paidInput')?.value) || 0;
      const change = paid - total;
      if (document.getElementById('cartSubtotal')) document.getElementById('cartSubtotal').innerText = `Rs ${subtotal.toLocaleString()}`;
      if (document.getElementById('cartTax')) document.getElementById('cartTax').innerText = `Rs ${Math.round(tax).toLocaleString()}`;
      if (document.getElementById('cartTotal')) document.getElementById('cartTotal').innerText = `Rs ${Math.round(total).toLocaleString()}`;
      if (document.getElementById('changeDisplay')) document.getElementById('changeDisplay').innerText = `Rs ${change > 0 ? change.toFixed(0) : 0}`;
    };

    document.getElementById('discountInput')?.addEventListener('input', updateCartUI);
    document.getElementById('paidInput')?.addEventListener('input', updateCartUI);
    document.getElementById('clearCartBtn')?.addEventListener('click', () => { cart = []; updateCartUI(); showToast('Cart cleared', 'info'); });
    document.getElementById('completeSaleBtn')?.addEventListener('click', () => {
      if (cart.length === 0) { showToast('Cart is empty', 'warning'); return; }
      // decrease stock
      cart.forEach(item => {
        const prod = products.find(p => p.id === item.id);
        if (prod) prod.stock = Math.max(0, prod.stock - item.qty);
      });
      const total = cart.reduce((a,b) => a + (b.selling * b.qty), 0);
      showToast(`Sale completed! Rs ${Math.round(total).toLocaleString()} (demo)`, 'success');
      cart = [];
      updateCartUI();
      renderPosProducts();
    });

    updateCartUI();
  }

      const ctx2 = document.getElementById('reportChart2')?.getContext('2d');
      if (ctx2) new Chart(ctx2, { type: 'line', data: { labels: ['Jan','Feb','Mar','Apr','May','Jun'], datasets: [{ label: 'Net Profit', data: [1.2, 1.8, 2.1, 2.0, 2.5, 2.8], borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.06)', tension: 0.3, fill: true }] }, options: { plugins: { legend: { display: false } } } });
      const ctx3 = document.getElementById('reportChart3')?.getContext('2d');
      if (ctx3) new Chart(ctx3, { type: 'bar', data: { labels: ['Phones', 'Accessories', 'Wearables', 'Tablets'], datasets: [{ label: 'Revenue (Lakhs)', data: [8.5, 1.8, 1.2, 0.9], backgroundColor: '#2563eb', borderRadius: 6 }] } });
    }, 50);
  }

  // ============================================================
  // UTILITIES
  // ============================================================
  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle text-emerald-300' : 'fa-exclamation-circle text-amber-300'}"></i> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
  }

  function showModal(title, contentHtml, onConfirm) {
    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4';
    overlay.innerHTML = `<div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-blue-100 max-h-[90vh] overflow-y-auto"><h3 class="font-semibold text-lg mb-4 text-blue-800">${title}</h3><div class="space-y-3">${contentHtml}</div><div class="flex justify-end gap-2 mt-6"><button class="cancel-btn px-4 py-2 text-sm text-slate-500 hover:text-slate-700 transition">Cancel</button><button class="confirm-btn btn-primary text-white px-5 py-2 rounded-lg text-sm shadow-sm shadow-blue-200">Confirm</button></div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.cancel-btn').addEventListener('click', () => overlay.remove());
    overlay.querySelector('.confirm-btn').addEventListener('click', () => { if (onConfirm) onConfirm(); overlay.remove(); });
  }

  // ============================================================
  // SIDEBAR TOGGLE
  // ============================================================
  function openSidebar() { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
  function closeSidebar() { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
  document.getElementById('menuToggle')?.addEventListener('click', openSidebar);
  overlay?.addEventListener('click', closeSidebar);

  // Notification bell
  document.getElementById('notificationBell')?.addEventListener('click', () => {
    showToast('5 new notifications: Low stock, Due payments, New sale', 'info');
  });

  // ============================================================
  // INITIAL RENDER + NAV
  // ============================================================
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => { renderPage(item.dataset.page); });
  });
  renderPage('dashboard');
</script>
